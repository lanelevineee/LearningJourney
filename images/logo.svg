<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#logoGradient)"/>
  
  <!-- Zen Symbol - Balanced Scales -->
  <g transform="translate(50, 50)" fill="white">
    <!-- Top Balance Bar -->
    <rect x="-25" y="-15" width="50" height="4" rx="2" fill="white"/>
    
    <!-- Center Point -->
    <circle cx="0" cy="-13" r="4" fill="white"/>
    
    <!-- Vertical Stand -->
    <rect x="-3" y="-13" width="6" height="25" rx="2" fill="white"/>
    
    <!-- Left Scale -->
    <path d="M -20 12 L -20 22 A 8 8 0 0 0 -4 22 L -4 12 Z" fill="white" opacity="0.9"/>
    
    <!-- Right Scale -->
    <path d="M 20 12 L 20 22 A 8 8 0 0 0 4 22 L 4 12 Z" fill="white" opacity="0.9"/>
    
    <!-- Base -->
    <rect x="-12" y="22" width="24" height="4" rx="2" fill="white"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>
