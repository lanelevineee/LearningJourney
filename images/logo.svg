<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Balance Scale Icon -->
  <g transform="translate(10, 10)">
    <!-- Base -->
    <rect x="15" y="35" width="10" height="5" rx="1" fill="#2563eb"/>
    <rect x="18" y="30" width="4" height="5" fill="#2563eb"/>
    
    <!-- Pole -->
    <rect x="19" y="10" width="2" height="20" fill="#2563eb"/>
    
    <!-- Beam -->
    <rect x="5" y="8" width="30" height="2" rx="1" fill="#2563eb"/>
    
    <!-- Left Pan -->
    <path d="M8 10 L5 20 Q5 22 8 22 L12 22 Q15 22 15 20 L12 10" stroke="#2563eb" stroke-width="1.5" fill="none"/>
    
    <!-- Right Pan -->
    <path d="M28 10 L25 20 Q25 22 28 22 L32 22 Q35 22 35 20 L32 10" stroke="#2563eb" stroke-width="1.5" fill="none"/>
    
    <!-- Strings -->
    <line x1="8" y1="8" x2="8" y2="10" stroke="#2563eb" stroke-width="0.8"/>
    <line x1="12" y1="8" x2="12" y2="10" stroke="#2563eb" stroke-width="0.8"/>
    <line x1="28" y1="8" x2="28" y2="10" stroke="#2563eb" stroke-width="0.8"/>
    <line x1="32" y1="8" x2="32" y2="10" stroke="#2563eb" stroke-width="0.8"/>
  </g>
  
  <!-- Text "ZEN" -->
  <text x="55" y="38" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#0f172a">ZEN</text>
  
  <!-- Tagline -->
  <text x="55" y="50" font-family="'Manrope', sans-serif" font-size="8" fill="#64748b" letter-spacing="2">ACCOUNTING</text>
</svg>
